[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flouds-model-exporter"
version = "2.0.3"
description = "Flouds Model Exporter: ONNX export and optimization utilities"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["onnx", "export", "huggingface", "optimum", "model-export"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "Goutam Malakar" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

classifiers = [
	"Development Status :: 4 - Beta",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries",
	"Topic :: Software Development :: Quality Assurance",
	"Programming Language :: Python :: 3 :: Only",
]
dependencies = [
	"transformers>=4.44.0,<4.58.0",
	"onnx>=1.16.1,<2",
	"onnxruntime>=1.20.1",
	"optimum>=1.22.0",
	"optimum-onnx[onnxruntime]>=0.1.0",
	"numpy>=1.26.4,<3",
	"huggingface_hub[hf_xet]>=0.34.0,<1.0",
	"psutil>=5.9.8,<8",
	"protobuf>=4.25.3",
	"PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/gmalakar/flouds_model_exporter"
Repository = "https://github.com/gmalakar/flouds_model_exporter"
Issues = "https://github.com/gmalakar/flouds_model_exporter/issues"

[project.optional-dependencies]
dev = [
	"pre-commit==4.7.0",
	"pytest>=7.0.0",
	"black==25.12.0",
	"isort==6.1.0",
	"flake8==7.5.0",
	"flake8-bugbear",
	"flake8-comprehensions",
	"mypy==1.20.2",
	"bandit==1.9.4",
]

[project.scripts]
flouds-export = "model_exporter.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
# Integration tests download a model and run a real export; run them with
# `pytest -m integration tests/integration`.
markers = ["integration: real export against the Hugging Face hub (needs network)"]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_exporter*"]
exclude = ["tests*", "tools*"]

[tool.setuptools]
include-package-data = true
