repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3.14
        args: ['--line-length=150']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 6.1.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length=150']

  # Linting with flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [
          '--ignore-missing-imports',
          '--no-implicit-optional',
          '--warn-redundant-casts',
          '--warn-unused-ignores',
          '--disallow-incomplete-defs'
        ]
        exclude: ^(tests/|scripts/)

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-ll', '--exclude', 'tests/']
        additional_dependencies:
          - pbr
        exclude: ^(tests/|scripts/)

  # YAML validation and general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key

  # Local custom hooks
  - repo: local
    hooks:
      - id: add-header
        name: Add copyright header
        # -E: ignore PYTHON* variables inherited from the Python that runs
        # pre-commit (a uv venv launcher exports PYTHONHOME).
        entry: python -E tools/add_all_headers.py
        language: system
        files: \.py$
      - id: pre-push-tests
        name: Run tests and type checks on push
        entry: python -E tools/pre_push_checks.py
        language: system
        stages: [pre-push]

default_language_version:
  python: python3.14

default_stages: [pre-commit]

exclude: '(^|/)(\.venv|__pycache__|\.git|\.idea|\.pytest_cache|build|dist|[^/]+\.egg-info)(/|$)'
